test_cases:
  - input:
      name: "Jcc DEFAULT: JO rel16"
      bytes: [0x66, 0x0f, 0x80, 0xce, 0xfa, 0xa5, 0xd8]
      arch: CS_ARCH_X86
      options: [CS_MODE_64, CS_OPT_DETAIL]
      address: 0
    expected:
      insns:
        - asm_text: "jo 0xfffffffffffffad3"
          size: 5
          details:
            x86:
              enc_imm_offset: 3
              enc_imm_size: 2
              operands:
                - type: X86_OP_IMM
                  imm: -1325
                  size: 4
        - asm_text: "movsd dword ptr [rdi], dword ptr [rsi]"
          size: 1
  - input:
      name: "Jcc DEFAULT: JB rel32"
      bytes: [0x66, 0x0f, 0x82, 0xce, 0xfa, 0xa5, 0xd8]
      arch: CS_ARCH_X86
      options: [CS_MODE_64, CS_OPT_DETAIL]
      address: 0
    expected:
      insns:
        - asm_text: "jb 0xffffffffd8a5fad5"
          size: 7
          details:
            x86:
              enc_imm_size: 4
              operands:
                - type: X86_OP_IMM
                  imm: -660210987
                  size: 4
  - input:
      name: "Jcc AMD: JO rel16 and following MOVSD"
      bytes: [0x66, 0x0f, 0x80, 0xce, 0xfa, 0xa5, 0xd8]
      arch: CS_ARCH_X86
      options: [CS_MODE_64, CS_OPT_DETAIL, CS_MODE_X86_JCC_AMD]
      address: 0x123450000
    expected:
      insns:
        - asm_text: "jo 0xfad3"
          size: 5
          details:
            x86:
              enc_imm_offset: 3
              enc_imm_size: 2
              operands:
                - type: X86_OP_IMM
                  imm: 0xfad3
                  size: 2
        - asm_text: "movsd dword ptr [rdi], dword ptr [rsi]"
          size: 1
  - input:
      name: "Jcc AMD: JNO in AT&T syntax"
      bytes: [0x66, 0x0f, 0x81, 0xce, 0xfa, 0xa5, 0xd8]
      arch: CS_ARCH_X86
      options: [CS_MODE_64, CS_OPT_DETAIL, CS_MODE_X86_JCC_AMD, CS_OPT_SYNTAX_ATT]
      address: 0
    expected:
      insns:
        - asm_text: "jno 0xfad3"
          size: 5
          details:
            x86:
              enc_imm_size: 2
              operands:
                - type: X86_OP_IMM
                  imm: 0xfad3
                  size: 2
        - asm_text: "movsl (%rsi), (%rdi)"
          size: 1
  - input:
      name: "Jcc AMD: JB target wraparound"
      bytes: [0x66, 0x0f, 0x82, 0x01, 0x00]
      arch: CS_ARCH_X86
      options: [CS_MODE_64, CS_OPT_DETAIL, CS_MODE_X86_JCC_AMD]
      address: 0xfffe
    expected:
      insns:
        - asm_text: "jb 4"
          size: 5
          details:
            x86:
              enc_imm_size: 2
              operands:
                - type: X86_OP_IMM
                  imm: 4
                  size: 2
  - input:
      name: "Jcc AMD: REX.W overrides 66"
      bytes: [0x66, 0x48, 0x0f, 0x80, 0xce, 0xfa, 0xa5, 0xd8]
      arch: CS_ARCH_X86
      options: [CS_MODE_64, CS_OPT_DETAIL, CS_MODE_X86_JCC_AMD]
      address: 0
    expected:
      insns:
        - asm_text: "jo 0xffffffffd8a5fad6"
          size: 8
          details:
            x86:
              enc_imm_offset: 4
              enc_imm_size: 4
              operands:
                - type: X86_OP_IMM
                  imm: -660210986
                  size: 8
  - input:
      name: "Jcc AMD: 66 after REX.W"
      bytes: [0x48, 0x66, 0x0f, 0x80, 0xce, 0xfa, 0xa5, 0xd8]
      arch: CS_ARCH_X86
      options: [CS_MODE_64, CS_OPT_DETAIL, CS_MODE_X86_JCC_AMD]
      address: 0
    expected:
      insns:
        - asm_text: "jo 0xfad4"
          size: 6
          details:
            x86:
              enc_imm_offset: 4
              enc_imm_size: 2
              operands:
                - type: X86_OP_IMM
                  imm: 0xfad4
                  size: 2
        - asm_text: "movsd dword ptr [rdi], dword ptr [rsi]"
          size: 1
  - input:
      name: "Jcc Intel: JG rel32"
      bytes: [0x66, 0x0f, 0x8f, 0xce, 0xfa, 0xa5, 0xd8]
      arch: CS_ARCH_X86
      options: [CS_MODE_64, CS_OPT_DETAIL, CS_MODE_X86_JCC_INTEL]
      address: 0
    expected:
      insns:
        - asm_text: "jg 0xffffffffd8a5fad5"
          size: 7
          details:
            x86:
              enc_imm_size: 4
              operands:
                - type: X86_OP_IMM
                  imm: -660210987
                  size: 8
  - input:
      name: "Jcc AMD: JG rel16"
      bytes: [0x66, 0x0f, 0x8f, 0xce, 0xfa]
      arch: CS_ARCH_X86
      options: [CS_MODE_64, CS_OPT_DETAIL, CS_MODE_X86_JCC_AMD]
      address: 0
    expected:
      insns:
        - asm_text: "jg 0xfad3"
          size: 5
          details:
            x86:
              enc_imm_size: 2
              operands:
                - type: X86_OP_IMM
                  imm: 0xfad3
                  size: 2
  - input:
      name: "Jcc Intel flag preserves 64-bit operands and registers"
      bytes: [0x48, 0xc7, 0xc0, 0xff, 0xff, 0xff, 0xff, 0x48, 0xa1, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0x0f, 0x31, 0xd9, 0x20, 0xa5, 0xe8, 0x00, 0x00, 0x00, 0x00, 0xc3]
      arch: CS_ARCH_X86
      options: [CS_MODE_64, CS_MODE_X86_JCC_INTEL, CS_OPT_DETAIL]
      address: 0x100000000
    expected:
      insns:
        - asm_text: "mov rax, 0xffffffffffffffff"
          details:
            x86:
              operands:
                - type: X86_OP_REG
                  reg: rax
                  size: 8
                - type: X86_OP_IMM
                  imm: -1
                  size: 8
        - asm_text: "movabs rax, qword ptr [0xffffffffffffffff]"
        - asm_text: "rdtsc"
          details:
            regs_write: [rax, rdx]
        - asm_text: "fldenv [rax]"
          details:
            x86:
              operands:
                - type: X86_OP_MEM
                  mem_base: rax
                  size: 28
        - asm_text: "movsd dword ptr [rdi], dword ptr [rsi]"
          details:
            regs_read: [rdi, rsi, rflags]
            regs_write: [rdi, rsi]
        - asm_text: "call 0x10000001b"
        - asm_text: "ret"
  - input:
      name: "Jcc AMD flag preserves 64-bit operands and registers in AT&T syntax"
      bytes: [0x48, 0xc7, 0xc0, 0xff, 0xff, 0xff, 0xff, 0x48, 0xa1, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0x0f, 0x31, 0xd9, 0x20, 0xa5, 0xe8, 0x00, 0x00, 0x00, 0x00, 0xc3]
      arch: CS_ARCH_X86
      options: [CS_MODE_64, CS_MODE_X86_JCC_AMD, CS_OPT_DETAIL, CS_OPT_SYNTAX_ATT]
      address: 0x100000000
    expected:
      insns:
        - asm_text: "movq $0xffffffffffffffff, %rax"
          details:
            x86:
              operands:
                - type: X86_OP_IMM
                  imm: -1
                  size: 8
                - type: X86_OP_REG
                  reg: rax
                  size: 8
        - asm_text: "movabsq 0xffffffffffffffff, %rax"
        - asm_text: "rdtsc"
          details:
            regs_write: [rax, rdx]
        - asm_text: "fldenv (%rax)"
          details:
            x86:
              operands:
                - type: X86_OP_MEM
                  mem_base: rax
                  size: 28
        - asm_text: "movsl (%rsi), (%rdi)"
          details:
            regs_read: [rdi, rsi, rflags]
            regs_write: [rdi, rsi]
        - asm_text: "callq 0x10000001b"
        - asm_text: "retq"
