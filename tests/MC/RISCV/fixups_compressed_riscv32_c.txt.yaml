test_cases:
  -
    input:
      bytes: [ 0x81 ]
      arch: "CS_ARCH_RISCV"
      options: [ "riscv32", "c" ]
    expected:
      insns:
        -
          asm_text: "beqz a3, .LBB0_2"

  -
    input:
      bytes: [ 0x81 ]
      arch: "CS_ARCH_RISCV"
      options: [ "riscv32", "c" ]
    expected:
      insns:
        -
          asm_text: "bnez a5, .LBB0_2"

  -
    input:
      bytes: [ 0x01, 0x00 ]
      arch: "CS_ARCH_RISCV"
      options: [ "riscv32", "c" ]
    expected:
      insns:
        -
          asm_text: "nop"
