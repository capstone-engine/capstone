test_cases:
  -
    input:
      bytes: [ 0x2e, 0x95 ]
      arch: "CS_ARCH_RISCV"
      options: [ "riscv32", "f", "+c" ]
    expected:
      insns:
        -
          asm_text: ".insn cr 2, 9, a0, a1"

  -
    input:
      bytes: [ 0x35, 0x05 ]
      arch: "CS_ARCH_RISCV"
      options: [ "riscv32", "f", "+c" ]
    expected:
      insns:
        -
          asm_text: ".insn ci 1, 0, a0, 13"

  -
    input:
      bytes: [ 0xa8, 0x01 ]
      arch: "CS_ARCH_RISCV"
      options: [ "riscv32", "f", "+c" ]
    expected:
      insns:
        -
          asm_text: ".insn ciw 0, 0, a0, 13"

  -
    input:
      bytes: [ 0xaa, 0xc6 ]
      arch: "CS_ARCH_RISCV"
      options: [ "riscv32", "f", "+c" ]
    expected:
      insns:
        -
          asm_text: ".insn css 2, 6, a0, 13"

  -
    input:
      bytes: [ 0xa8, 0x4d ]
      arch: "CS_ARCH_RISCV"
      options: [ "riscv32", "f", "+c" ]
    expected:
      insns:
        -
          asm_text: ".insn cl 0, 2, a0, 13(a1)"

  -
    input:
      bytes: [ 0xa8, 0xcd ]
      arch: "CS_ARCH_RISCV"
      options: [ "riscv32", "f", "+c" ]
    expected:
      insns:
        -
          asm_text: ".insn cs 0, 6, a0, 13(a1)"

  -
    input:
      bytes: [ 0x0d, 0x8d ]
      arch: "CS_ARCH_RISCV"
      options: [ "riscv32", "f", "+c" ]
    expected:
      insns:
        -
          asm_text: ".insn ca 1, 35, 0, a0, a1"

  -
    input:
      bytes: [ 0x01 ]
      arch: "CS_ARCH_RISCV"
      options: [ "riscv32", "f", "+c" ]
    expected:
      insns:
        -
          asm_text: ".insn cb 1, 6, a0, target"
