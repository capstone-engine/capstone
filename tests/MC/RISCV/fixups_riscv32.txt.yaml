test_cases:
  -
    input:
      bytes: [ 0x23 ]
      arch: "CS_ARCH_RISCV"
      options: [ "riscv32" ]
    expected:
      insns:
        -
          asm_text: "sw a0, %lo(val)(t1)"

  -
    input:
      bytes: [ 0x23 ]
      arch: "CS_ARCH_RISCV"
      options: [ "riscv32" ]
    expected:
      insns:
        -
          asm_text: "sw t1, %pcrel_lo(.Ltmp0)(t1)"

  -
    input:
      bytes: [ 0x63 ]
      arch: "CS_ARCH_RISCV"
      options: [ "riscv32" ]
    expected:
      insns:
        -
          asm_text: "beq a0, a1, .LBB0"

  -
    input:
      bytes: [ 0x63 ]
      arch: "CS_ARCH_RISCV"
      options: [ "riscv32" ]
    expected:
      insns:
        -
          asm_text: "blt a0, a1, .LBB1"

  -
    input:
      bytes: [ 0x13, 0x00, 0x00, 0x00 ]
      arch: "CS_ARCH_RISCV"
      options: [ "riscv32" ]
    expected:
      insns:
        -
          asm_text: "addi zero, zero, 0"

  -
    input:
      bytes: [ 0x97 ]
      arch: "CS_ARCH_RISCV"
      options: [ "riscv32" ]
    expected:
      insns:
        -
          asm_text: "call func"
