test_cases:
  -
    input:
      bytes: [ 0xd5, 0x86, 0x00, 0x16 ]
      arch: "CS_ARCH_SPARC"
      options: [ "CS_MODE_BIG_ENDIAN" ]
    expected:
      insns:
        -
          asm_text: "ld [%i0+%l6], %c10"

