  # --- PMOVE TC,(A0) : move Translation Control register to memory ---
  # Ext word: 0x4200 (direction=1 → reg first: register to EA)
  # From binutils: pmove, two(0xf000,0x4200), two(0xffc0,0xffff), "08%s"
