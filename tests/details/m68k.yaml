  # --- PMOVE (A1),SRP : move memory to Supervisor Root Pointer ---
  # SRP is register code 100 in bits 12-10 of ext word
  # Ext word 0x4800: direction=0 → EA first (memory to register)
  # First word: 0xF011 (F000 | EA for (A1) = 010_001)
  -
    input:
