test_cases:
  -
    input:
      name: "aarch64 x29 alias in middle"
      bytes: [ 0xfd, 0x03, 0x00, 0x91 ]
      arch: "CS_ARCH_AARCH64"
      options: [ CS_MODE_LITTLE_ENDIAN, CS_OPT_DETAIL, CS_OPT_SYNTAX_CS_REG_ALIAS ]
      address: 0x0
    expected:
      insns:
      -
        asm_text: "mov fp, sp"
  -
    input:
      name: "aarch64 x30 alias in middle"
      bytes: [ 0xfe, 0x03, 0x00, 0x91 ]
      arch: "CS_ARCH_AARCH64"
      options: [ CS_MODE_LITTLE_ENDIAN, CS_OPT_DETAIL, CS_OPT_SYNTAX_CS_REG_ALIAS ]
      address: 0x0
    expected:
      insns:
      -
        asm_text: "mov lr, sp"
  -
    input:
      name: "aarch64 x29 and x30 both replaced"
      bytes: [ 0xfd, 0x7b, 0xbf, 0xa9 ]
      arch: "CS_ARCH_AARCH64"
      options: [ CS_MODE_LITTLE_ENDIAN, CS_OPT_DETAIL, CS_OPT_SYNTAX_CS_REG_ALIAS ]
      address: 0x0
    expected:
      insns:
      -
        asm_text: "stp fp, lr, [sp, #-0x10]!"
  -
    input:
      name: "aarch64 x29 with 0x29 hex prefix in immediate"
      bytes: [ 0x1d, 0xa4, 0x00, 0xd1 ]
      arch: "CS_ARCH_AARCH64"
      options: [ CS_MODE_LITTLE_ENDIAN, CS_OPT_DETAIL, CS_OPT_SYNTAX_CS_REG_ALIAS ]
      address: 0x0
    expected:
      insns:
      -
        asm_text: "sub fp, x0, #0x29"
  -
    input:
      name: "aarch64 x30 with 0x30 hex prefix in immediate"
      bytes: [ 0x1e, 0xc0, 0x00, 0xd1 ]
      arch: "CS_ARCH_AARCH64"
      options: [ CS_MODE_LITTLE_ENDIAN, CS_OPT_DETAIL, CS_OPT_SYNTAX_CS_REG_ALIAS ]
      address: 0x0
    expected:
      insns:
      -
        asm_text: "sub lr, x0, #0x30"
  -
    input:
      name: "aarch64 x29 at end of string"
      bytes: [ 0xf4, 0x03, 0x1d, 0xaa ]
      arch: "CS_ARCH_AARCH64"
      options: [ CS_MODE_LITTLE_ENDIAN, CS_OPT_DETAIL, CS_OPT_SYNTAX_CS_REG_ALIAS ]
      address: 0x0
    expected:
      insns:
      -
        asm_text: "mov x20, fp"
  -
    input:
      name: "aarch64 x30 at middle and end"
      bytes: [ 0xfe, 0x03, 0x1e, 0xaa ]
      arch: "CS_ARCH_AARCH64"
      options: [ CS_MODE_LITTLE_ENDIAN, CS_OPT_DETAIL, CS_OPT_SYNTAX_CS_REG_ALIAS ]
      address: 0x0
    expected:
      insns:
      -
        asm_text: "mov lr, lr"
  -
    input:
      name: "aarch64 x29 and x30 at end"
