- changed-files:
  - any-glob-to-any-file:
    - arch/ARM/**
    - cstool/cstool_arm.c
    - include/capstone/arm.h
    - suite/MC/ARM/**
    - tests/MC/ARM/**
    - tests/details/arm.yaml

