Auto-Sync-files:
- changed-files:
  - any-glob-to-any-file:
    - suite/auto-sync/**

LLVM-core-files:
- changed-files:
  - any-glob-to-any-file:
    - MC*.[ch]

LLVM-generated-files:
- changed-files:
  - any-glob-to-any-file:
    - arch/*/*.inc

Documentation:
- changed-files:
  - any-glob-to-any-file:
    - '**/*.md'

CS-core-files:
- changed-files:
  - any-glob-to-any-file:
    - cs*.[ch]
    - SStream.[ch]
    - utis.[ch]
    - MathExtras.h
    - Mapping.[ch]
    - LEB128.h
    - cstool/cstool.[ch]
    - cstool/getopt.[ch]
    - include/capstone/capstone.h
    - include/capstone/cs_operand.h
    - include/capstone/platform.h

